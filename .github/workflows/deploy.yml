name: Deploy Frontend

on:
  push:
    branches:
      - main
      - devserver

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: TestingCICD

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519-querlabs
          chmod 600 ~/.ssh/id_ed25519-querlabs

      - name: Deploy Dev Server
        if: github.ref == 'refs/heads/devserver'
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_ed25519-querlabs \
              -p "${{ secrets.VPS_PORT }}" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}" << 'EOF'

          set -e

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          cd /home/administrator/querlabs/testing-frontend/testing-frontend

          # ==========================
          # Create .env.local
          # ==========================
          cat > .env.local <<ENV
          NODE_ENV_DEV=${{ secrets.NODE_ENV_DEV }}
          MONGO_USERNAME=${{ secrets.MONGO_USERNAME }}
          MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}
          NODE_ENV=${{ secrets.NODE_ENV }}
          NEXT_PUBLIC_BACKEND_BASE_URL=${{ secrets.NEXT_PUBLIC_BACKEND_BASE_URL }}
          NEXT_PUBLIC_BACKEND_PROD_URL=${{ secrets.NEXT_PUBLIC_BACKEND_PROD_URL }}
          NEXT_PUBLIC_SOCKET_MODE=${{ secrets.NEXT_PUBLIC_SOCKET_MODE }}
          NEXT_PUBLIC_BACKEND_BASE_URL_SOCKET=${{ secrets.NEXT_PUBLIC_BACKEND_BASE_URL_SOCKET }}
          NEXT_PUBLIC_BACKEND_PROD_URL_SOCKET=${{ secrets.NEXT_PUBLIC_BACKEND_PROD_URL_SOCKET }}

          ENV

          git fetch origin devserver
          git reset --hard origin/devserver
          git clean -fd

          rm -rf .next

          npm install
          npm run build

          pm2 delete testing-frontend  || true
          pm2 restart /home/administrator/querlabs/testing-frontend/testing-frontend/ecosystem.config.js
          pm2 save

          EOF

      - name: Deploy Production
        if: github.ref == 'refs/heads/main'
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_ed25519-querlabs \
              -p "${{ secrets.VPS_PORT }}" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}" << 'EOF'

          set -e

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          cd /home/administrator/querlabs/testing-frontend/testing-frontend

          # ==========================
          # Create .env.local
          # ==========================
          cat > .env.local <<ENV
          NODE_ENV_PROD=${{ secrets.NODE_ENV_PROD }}
          MONGO_USERNAME=${{ secrets.MONGO_USERNAME }}
          MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}
          NODE_ENV=${{ secrets.NODE_ENV }}
          NEXT_PUBLIC_BACKEND_BASE_URL=${{ secrets.NEXT_PUBLIC_BACKEND_BASE_URL }}
          NEXT_PUBLIC_BACKEND_PROD_URL=${{ secrets.NEXT_PUBLIC_BACKEND_PROD_URL }}
          NEXT_PUBLIC_SOCKET_MODE=${{ secrets.NEXT_PUBLIC_SOCKET_MODE }}
          NEXT_PUBLIC_BACKEND_BASE_URL_SOCKET=${{ secrets.NEXT_PUBLIC_BACKEND_BASE_URL_SOCKET }}
          NEXT_PUBLIC_BACKEND_PROD_URL_SOCKET=${{ secrets.NEXT_PUBLIC_BACKEND_PROD_URL_SOCKET }}
          
          ENV

          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          rm -rf .next

          npm install
          npm run build

          pm2 restart testing-frontend || pm2 restart ecosystem.config.js --only  testing-frontend

          pm2 save

          EOF
